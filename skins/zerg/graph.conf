# RRDtool graph colours for the Zerg skin.
#
# Graph interiors are rendered server-side to PNG by RRDtool, so CSS cannot
# touch them. LibreNMS does expose them as config, in two separate places:
#
#   rrdgraph_def_text_dark  the CHROME - background, grid, frame, arrows.
#                           Read by GraphParameters::graphColors().
#   graph_colours.*         the DATA SERIES ramps. Individual graph files pick
#                           a palette BY NAME (port graphs use 'greens' for in
#                           and 'blues' for out), so retheming the named
#                           palettes retints the series.
#
# install.sh applies every key below and records the previous value;
# uninstall.sh sets the originals back. Note it restores by SETTING, not by
# clearing - `lnms config:clear` does not reliably revert these keys.
#
# Caveat: 149 graph definition files hard-code hex instead of using a palette
# (see docs/FINDINGS.md section 5). Those cannot be retinted from config at
# all, so a few graph types will keep stock series colours.

rrdgraph_def_text_dark=-c BACK#1d1019 -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#2e1b28 -c MGRID#4d2d3d -c FRAME#4d2d3d -c ARROW#a9cc3c
rrdgraph_def_text_color_dark=d6c5b6
graph_colours.greens=["D8EE6E","C4E052","A9CC3C","8CAB2E","6F8922","536817"]
graph_colours.blues=["C79BF0","B07FE3","9D5BD8","8446BC","6B379B","52297A"]
graph_colours.oranges=["FFB068","FF9440","FF7A1F","D26012","A54A0D","783509"]
graph_colours.purples=["E0A0C8","CC82B0","B86598","9A4E7D","7B3B62","5C2A48"]
