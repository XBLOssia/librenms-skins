# RRDtool graph colours for the Zerg skin.
#
# Graph interiors are rendered server-side to PNG by RRDtool, so CSS cannot
# touch them. LibreNMS exposes them as config in TWO separate places:
#
#   rrdgraph_def_text_dark   the CHROME - background, grid, frame, arrows.
#                            Read by GraphParameters::graphColors().
#   graph_colours.*          the DATA SERIES ramps. Graph files pick a palette
#                            BY NAME - port graphs use 'greens' for in and
#                            'blues' for out - so retinting the named palettes
#                            retints the series.
#
# WHAT IS DELIBERATELY NOT RETINTED
# manycolours (35), psychedelic (32), rainbow (12), rainbow_stats_* (11),
# mixed (8) and varied (8) are multi-hue ON PURPOSE: they colour graphs that
# plot many series at once, and hue is what tells the series apart. Collapsing
# them into one skin hue would look consistent and be unreadable. They are left
# stock by choice, not by omission.
#
# Entry counts match the upstream defaults - a graph file walks the palette by
# index and wraps when it runs out, so a shorter ramp repeats sooner.
#
# install.sh applies every key below and records the previous value;
# uninstall.sh sets the originals back. It restores by SETTING, not clearing -
# `lnms config:clear` does not reliably revert these keys.
#
# IMPORTANT CAVEAT - port graph SERIES are not affected by any of this.
# Be precise about which half: rrdgraph_def_text_dark above DOES apply to port
# graphs, so their background, grid and frame are themed like everything else.
# It is only the ink that is stuck.
#
# port_bits resolves to includes/html/graphs/generic_data.inc.php, which
# hardcodes its series colours (#90B040 green in, #8080C0 lavender out, lines
# 149-159) and contains zero references to graph_colours.
#
# This is a property of the graph TYPE, not of the page. The dashboard, device
# pages and standalone graph pages all render through the same
# /graph/id=N?type=X endpoint. A dashboard built mostly from port_bits widgets
# looks completely unthemed while the device pages look fine - same config,
# same endpoint, different helper. Measured by sampling the PNGs directly:
#
#   type=port_bits    #0f1a2e (chrome, ours) + #90b040 + #8080c0 (series, stock)
#   type=device_bits  #3fb8f5 #3ad6a8 #2cb08a #218c6e  (all ours, via greens/purples)
#
# Verified two ways: two skins with completely different palettes render
# byte-identical port graphs, and the pixel histogram above.
#
# Only a core change can theme those. 58 such literals live in 15 shared
# generic_* helpers, 40 of them in the 5 that read no config at all - see
# FINDINGS.md section 5.

rrdgraph_def_text_dark=-c BACK#1d1019 -c SHADEA#EEEEEE00 -c SHADEB#EEEEEE00 -c CANVAS#FFFFFF00 -c GRID#2e1b28 -c MGRID#4d2d3d -c FRAME#4d2d3d -c ARROW#a9cc3c
rrdgraph_def_text_color_dark=d6c5b6
graph_colours.greens=["D9F24E","BFDC33","A9CC3C","87A526","67811A","495C10"]
graph_colours.blues=["F07CD2","DB5CB8","C13F9C","A02B80","7D1C63","5A1246"]
graph_colours.oranges=["FFCE9E","FFA866","FF7A1F","E06210","BA4E0C","943C09","6E2B06","4A1B04"]
graph_colours.purples=["C79BF0","B07FE3","9D5BD8","8446BC","6B379B","52297A"]
graph_colours.default=["C79BF0","B07FE3","9D5BD8","8446BC","6B379B","52297A"]
graph_colours.pinks=["FF9F9A","F2706A","D8453F","B02F2A","8A211D","631613"]
